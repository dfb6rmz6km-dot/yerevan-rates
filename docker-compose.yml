services:
  backend:
    build: ./backend
    env_file:
      - path: .env
        required: false
    volumes:
      # справочник точек и кэш курсов живут на хосте: правьте JSON без пересборки
      - ./backend/data:/app/data
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    restart: unless-stopped

  # Только на сервере: HTTPS на вашем домене (DOMAIN в .env)
  caddy:
    image: caddy:2-alpine
    profiles: ["prod"]
    depends_on:
      - frontend
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
